<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>鹏城风云 · 深圳开放世界</title>
<style>
  :root{
    --line: rgba(122,176,255,.16);
    --dim: #8ba3bf;
    --acc: #5cc8ff;
    --ink: #e8eef8;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#05070b; color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #game{ display:block; width:100vw; height:100vh; background:#11151c; cursor:crosshair; }

  #hud{ position:fixed; inset:0; pointer-events:none; z-index:5; }

  .panel{
    position:absolute;
    background:rgba(7,11,18,.66);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    padding:10px 13px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }

  /* ---- 左上 状态 ---- */
  #status{ top:16px; left:16px; min-width:200px; }
  #status .top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  #money{ font-size:21px; font-weight:800; letter-spacing:.4px; color:#f2f8ff; }
  #district{ font-size:11px; color:var(--dim); letter-spacing:.6px; }
  .bars{ margin-top:9px; display:flex; flex-direction:column; gap:5px; }
  .bar{ height:7px; border-radius:5px; background:rgba(255,255,255,.09); overflow:hidden; }
  .bar i{ display:block; height:100%; width:100%; border-radius:5px;
          background:linear-gradient(90deg,#2fbf71,#68e2a0); transition:width .12s linear; }
  .bar.armor i{ width:0; background:linear-gradient(90deg,#3d8bfd,#7fc0ff); }
  #stars{ margin-top:9px; font-size:15px; letter-spacing:3px; color:rgba(255,255,255,.16); height:18px; }
  #stars b{ color:#ffcf4d; text-shadow:0 0 12px rgba(255,207,77,.65); font-weight:400; }

  /* ---- 右上 任务 ---- */
  #quest{ top:16px; right:16px; width:266px; }
  #quest .qtitle{ font-size:11px; letter-spacing:1.6px; color:var(--acc); font-weight:700; }
  #quest .qtext{ margin-top:6px; font-size:13px; line-height:1.5; color:#dfe9f7; }
  #quest .qtime{ margin-top:6px; font-size:12px; color:#ffd76a; min-height:0; }
  #quest.dim{ opacity:.55; }

  /* ---- 左下 小地图 ---- */
  #mapBox{ left:16px; bottom:16px; padding:7px; border-radius:14px; }
  #minimap{ display:block; width:220px; height:152px; border-radius:8px; }
  #mapBox .maptag{
    position:absolute; left:14px; bottom:12px; font-size:9px; letter-spacing:2.5px;
    color:rgba(180,210,240,.55);
  }

  /* ---- 右下 操作提示 ---- */
  #hint{
    right:16px; bottom:16px; font-size:11px; color:var(--dim); letter-spacing:.3px;
    padding:8px 12px; opacity:.82;
  }

  /* ---- 提示条 ---- */
  #toast{
    position:absolute; left:50%; bottom:104px; transform:translateX(-50%) translateY(8px);
    background:rgba(8,14,24,.9); border:1px solid var(--line); color:#eaf3ff;
    padding:9px 20px; border-radius:999px; font-size:13.5px; white-space:nowrap;
    opacity:0; transition:opacity .22s ease, transform .22s ease;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.big{
    font-size:26px; font-weight:800; letter-spacing:6px; padding:20px 44px; border-radius:16px;
    background:rgba(10,6,8,.86); border-color:rgba(255,120,120,.35); color:#ffd9d9;
    text-shadow:0 0 24px rgba(255,80,80,.5);
  }
  #toast.big small{ display:block; margin-top:8px; font-size:12px; letter-spacing:2px;
    font-weight:400; color:#ffb3b3; text-align:center; }

  #flash{ position:absolute; inset:0; background:radial-gradient(ellipse at center,
      rgba(255,30,40,0) 40%, rgba(255,30,40,.55) 100%); opacity:0; pointer-events:none; }
  #vignette{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); }

  /* ---- 开场 / 暂停 ---- */
  #overlay{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 760px at 50% 38%, rgba(20,36,58,.94), rgba(3,5,9,.985));
    pointer-events:auto; transition:opacity .35s ease;
  }
  #overlay.hide{ opacity:0; pointer-events:none; }
  .card{
    width:min(660px, 90vw); text-align:center; padding:34px 30px 30px;
    background:radial-gradient(closest-side, rgba(5,9,16,.92), rgba(5,9,16,.72));
    border:1px solid rgba(122,176,255,.10); border-radius:26px;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
  }
  .eyebrow{ font-size:10.5px; letter-spacing:5px; color:#6f8cae; }
  .card h1{
    margin:14px 0 10px; font-size:64px; letter-spacing:14px; font-weight:800; line-height:1;
    background:linear-gradient(180deg,#ffffff 10%,#8fc7f5 55%,#3f7fbd 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(92,200,255,.25);
  }
  .card .sub{ margin:0 auto; max-width:520px; font-size:13.5px; line-height:1.85; color:#9fb4cc; }
  .keys{
    margin:26px auto 22px; display:grid; grid-template-columns:repeat(3,1fr); gap:9px;
    max-width:560px;
  }
  .keys div{
    display:flex; flex-direction:column; gap:3px; padding:9px 6px;
    background:rgba(255,255,255,.035); border:1px solid rgba(122,176,255,.12); border-radius:9px;
  }
  .keys b{ font-size:12px; color:#cfe6ff; letter-spacing:.6px; font-weight:700; }
  .keys span{ font-size:11px; color:#7e94ad; }
  #startBtn{
    margin-top:4px; padding:14px 52px; font-size:15px; letter-spacing:2px;
    font-family:inherit; font-weight:700; color:#04121e; cursor:pointer;
    background:linear-gradient(180deg,#9fdcff,#4fb6ee); border:none; border-radius:10px;
    box-shadow:0 10px 34px rgba(79,182,238,.4); transition:transform .12s ease, box-shadow .12s ease;
  }
  #startBtn:hover{ transform:translateY(-2px); box-shadow:0 14px 40px rgba(79,182,238,.55); }
  #startBtn:active{ transform:translateY(0); }
  .fine{ margin-top:16px; font-size:10.5px; letter-spacing:.6px; color:#5c7086; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel" id="status">
    <div class="top">
      <span id="money">¥800</span>
      <span id="district">福田 · 华强北</span>
    </div>
    <div class="bars">
      <div class="bar"><i id="hpBar"></i></div>
      <div class="bar armor"><i id="apBar"></i></div>
    </div>
    <div id="stars"></div>
  </div>

  <div class="panel" id="quest">
    <div class="qtitle" id="qTitle">序章</div>
    <div class="qtext" id="qText">先熟悉一下这座城市，随便逛逛。</div>
    <div class="qtime" id="qTimer"></div>
  </div>

  <div class="panel" id="mapBox">
    <canvas id="minimap" width="440" height="304"></canvas>
    <div class="maptag">深圳 · SHENZHEN</div>
  </div>

  <div class="panel" id="hint">WASD 移动 · E 上下车 · 左键 射击 · 空格 手刹 · Shift 奔跑 · P 暂停</div>

  <div id="toast"></div>
  <div id="flash"></div>
  <div id="vignette"></div>

  <div id="overlay">
    <div class="card">
      <div class="eyebrow">开 放 世 界 原 型 · 深 圳</div>
      <h1>鹏城风云</h1>
      <p class="sub">
        按真实地标重建的深圳：从华强北的电子市场，到深圳湾的跨海大桥。<br />
        开车、接单、开枪、跑路。
      </p>
      <div class="keys">
        <div><b>W A S D</b><span>移动 / 驾驶</span></div>
        <div><b>鼠标左键</b><span>射击</span></div>
        <div><b>E</b><span>上车 / 下车</span></div>
        <div><b>Shift</b><span>奔跑</span></div>
        <div><b>空格</b><span>手刹漂移</span></div>
        <div><b>P</b><span>暂停</span></div>
      </div>
      <button id="startBtn">进 入 城 市</button>
      <div class="fine">Canvas 2D 实时渲染 · 无外部素材 · 单文件离线运行</div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   鹏城风云 — 深圳开放世界原型
   纯 Canvas 2D，无任何外部依赖。
   ================================================================ */

/* ---------------- 基础工具 ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function angDiff(a, b) { let d = (b - a + Math.PI) % TAU; if (d < 0) d += TAU; return d - Math.PI; }
function turnTo(a, b, step) { const d = angDiff(a, b); return a + (Math.abs(d) <= step ? d : Math.sign(d) * step); }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------------- 画布 ---------------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.floor(VW * DPR);
  cv.height = Math.floor(VH * DPR);
  cv.style.width = VW + 'px';
  cv.style.height = VH + 'px';
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
resize();

/* ---------------- 世界尺度 ---------------- */
const CELL = 560;          // 一个街区 + 一条路的边长
const ROAD = 120;          // 路宽
const RH = ROAD / 2;
const COLS = 13;           // 13 个街区宽 ≈ 7.3km（等比压缩）
const ROWS = 9;
const WW = COLS * CELL;
const WH = ROWS * CELL;

/* ---------------- 地标 ---------------- */
const LANDMARKS = [
  { i: 5, j: 3, name: '平安国际金融中心', kind: 'tower', lv: 9, w: 150, spire: true },
  { i: 9, j: 3, name: '京基100', kind: 'tower', lv: 8, w: 128 },
  { i: 9, j: 4, name: '地王大厦', kind: 'twin' },
  { i: 5, j: 4, name: '市民中心', kind: 'hall' },
  { i: 2, j: 5, name: '华润“春笋”', kind: 'tower', lv: 9, w: 132 },
  { i: 2, j: 4, name: '腾讯滨海大厦', kind: 'twin' },
  { i: 1, j: 4, name: '世界之窗', kind: 'parkland' },
  { i: 3, j: 5, name: '深圳湾体育中心', kind: 'stadium' },
  { i: 6, j: 3, name: '华强北 · 赛格广场', kind: 'tower', lv: 7, w: 120 },
  { i: 9, j: 5, name: '东门老街', kind: 'oldstreet' },
  { i: 11, j: 6, name: '盐田港', kind: 'port' },
  { i: 12, j: 6, name: '大梅沙', kind: 'parkland' },
  { i: 6, j: 0, name: '深圳北站', kind: 'hall' },
  { i: 0, j: 2, name: '深圳湾口岸', kind: 'hall' },
  { i: 0, j: 5, name: '深圳大学', kind: 'parkland' }
];
const LMK = {};
LANDMARKS.forEach(l => { LMK[l.i + ',' + l.j] = l; });

const PARKS = {
  '5,1': '莲花山公园', '4,2': '中心公园', '0,4': '南山公园',
  '7,2': '荔枝公园', '10,2': '仙湖植物园', '3,1': '塘朗山郊野公园',
  '11,2': '梧桐山', '7,6': '红树林保护区', '1,6': '蛇口海上世界'
};

/* ---------------- 世界生成 ---------------- */
const blocks = [];
const rand = mulberry32(0x5A17C3);
const rr = (a, b) => a + rand() * (b - a);
const ri = (a, b) => Math.floor(a + rand() * (b - a + 1));

function blockAt(i, j) {
  if (i < 0 || j < 0 || i >= COLS || j >= ROWS) return null;
  return blocks[i * ROWS + j];
}
function cellCenter(i, j) { return { x: i * CELL + CELL / 2, y: j * CELL + CELL / 2 }; }
function nodePos(i, j) { return { x: i * CELL, y: j * CELL }; }
function districtOf(i) { return i <= 3 ? '南山' : i <= 6 ? '福田' : i <= 9 ? '罗湖' : '盐田'; }

for (let i = 0; i < COLS; i++) {
  for (let j = 0; j < ROWS; j++) {
    const b = {
      i, j, district: districtOf(i),
      x: i * CELL + RH, y: j * CELL + RH,
      w: CELL - ROAD, h: CELL - ROAD,
      kind: 'city', buildings: [], trees: [], label: null, lm: null
    };
    const lm = LMK[i + ',' + j];
    if (lm) { b.kind = 'landmark'; b.lm = lm; b.label = lm.name; }
    else if (j >= 7) { b.kind = i >= 10 ? 'beach' : 'water'; }
    else if (PARKS[i + ',' + j]) { b.kind = 'park'; b.label = PARKS[i + ',' + j]; }
    blocks.push(b);
  }
}

function fillGrid(b, gx, gy, lvMin, lvMax) {
  const pad = 20;
  const cw = (b.w - pad * 2) / gx;
  const ch = (b.h - pad * 2) / gy;
  for (let a = 0; a < gx; a++) {
    for (let c = 0; c < gy; c++) {
      if (rand() < 0.09) continue;
      const m = rr(6, 13);
      const x = b.x + pad + a * cw + m;
      const y = b.y + pad + c * ch + m;
      const w = cw - m * 2, h = ch - m * 2;
      if (w < 24 || h < 24) continue;
      b.buildings.push({
        x, y, w, h, lv: ri(lvMin, lvMax), container: false, seed: rand()
      });
    }
  }
}

function buildLandmark(b) {
  const lm = b.lm;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const add = (x, y, w, h, lv) => b.buildings.push({ x, y, w, h, lv, container: false });
  switch (lm.kind) {
    case 'tower': {
      const w = lm.w || 130, h = lm.w || 130;
      add(cx - w / 2, cy - h / 2, w, h, lm.lv || 7);
      break;
    }
    case 'twin':
      add(cx - 100, cy - 82, 84, 164, 7);
      add(cx + 16, cy - 82, 84, 164, 7);
      break;
    case 'hall':
      add(cx - 168, cy - 58, 336, 116, 3);
      break;
    case 'parkland':
      for (let k = 0; k < 13; k++) {
        b.trees.push({ x: b.x + rr(18, b.w - 18), y: b.y + rr(18, b.h - 18), r: rr(8, 15) });
      }
      add(cx - 62, cy - 42, 124, 84, 2);
      break;
    case 'stadium':
      b.deco = 'oval';
      break;
    case 'oldstreet':
      fillGrid(b, 3, 3, 1, 3);
      break;
    case 'port':
      for (let k = 0; k < 9; k++) {
        b.buildings.push({
          x: b.x + 18 + k * 44, y: b.y + b.h - 130, w: 36, h: 116, lv: 1,
          container: true, tint: k % 3
        });
      }
      break;
    default:
      fillGrid(b, 2, 2, 2, 5);
  }
}

blocks.forEach(b => {
  if (b.kind === 'water' || b.kind === 'beach') return;
  if (b.kind === 'landmark') { buildLandmark(b); return; }
  if (b.kind === 'park') {
    const n = 12 + ((rand() * 8) | 0);
    for (let k = 0; k < n; k++) {
      b.trees.push({ x: b.x + rr(16, b.w - 16), y: b.y + rr(16, b.h - 16), r: rr(9, 17) });
    }
    return;
  }
  if (rand() < 0.07) {
    b.kind = 'park';
    b.label = null;
    for (let k = 0; k < 10; k++) {
      b.trees.push({ x: b.x + rr(16, b.w - 16), y: b.y + rr(16, b.h - 16), r: rr(9, 16) });
    }
    return;
  }
  if (b.district === '罗湖') fillGrid(b, 4, 4, 1, 5);
  else if (b.district === '福田') fillGrid(b, rand() < 0.3 ? 2 : 3, rand() < 0.3 ? 2 : 3, 3, 8);
  else if (b.district === '南山') fillGrid(b, rand() < 0.35 ? 2 : 3, rand() < 0.35 ? 2 : 3, 2, 7);
  else fillGrid(b, 2, 2, 1, 3);
});

/* 深圳湾大桥：一条向南跨海的引桥，可通行 */
const BRIDGE = { x: 1.15 * CELL, y: 6.72 * CELL, w: 116, h: WH - 6.72 * CELL };

function waterAt(x, y) {
  if (x < 0 || y < 0 || x >= WW || y >= WH) return false;
  const i = Math.floor(x / CELL), j = Math.floor(y / CELL);
  const b = blocks[i * ROWS + j];
  if (!b || b.kind !== 'water') return false;
  if (x > BRIDGE.x && x < BRIDGE.x + BRIDGE.w && y > BRIDGE.y) return false;
  // 道路上（含跨海高架）可以走
  const nx = Math.round(x / CELL) * CELL;
  const ny = Math.round(y / CELL) * CELL;
  if (Math.abs(x - nx) < RH || Math.abs(y - ny) < RH) return false;
  return true;
}

/* ---------------- 碰撞 ---------------- */
function forBuildingsNear(x, y, r, fn) {
  const i0 = clamp(Math.floor((x - r) / CELL), 0, COLS - 1);
  const i1 = clamp(Math.floor((x + r) / CELL), 0, COLS - 1);
  const j0 = clamp(Math.floor((y - r) / CELL), 0, ROWS - 1);
  const j1 = clamp(Math.floor((y + r) / CELL), 0, ROWS - 1);
  for (let i = i0; i <= i1; i++) {
    for (let j = j0; j <= j1; j++) {
      const b = blocks[i * ROWS + j];
      const arr = b.buildings;
      for (let k = 0; k < arr.length; k++) fn(arr[k]);
    }
  }
}

function resolveCircle(x, y, r) {
  let nx = x, ny = y, hit = false;
  forBuildingsNear(x, y, r + 6, (b) => {
    const cx = clamp(nx, b.x, b.x + b.w);
    const cy = clamp(ny, b.y, b.y + b.h);
    const dx = nx - cx, dy = ny - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 > r * r) return;
    if (d2 < 0.0001) {
      const left = nx - b.x, right = b.x + b.w - nx;
      const top = ny - b.y, bot = b.y + b.h - ny;
      const m = Math.min(left, right, top, bot);
      if (m === left) nx = b.x - r;
      else if (m === right) nx = b.x + b.w + r;
      else if (m === top) ny = b.y - r;
      else ny = b.y + b.h + r;
      hit = true;
      return;
    }
    const d = Math.sqrt(d2), k = (r - d) / d;
    nx += dx * k; ny += dy * k;
    hit = true;
  });
  return { x: nx, y: ny, hit };
}

/* ---------------- 镜头 ---------------- */
const cam = { x: 6 * CELL, y: 4 * CELL, zoom: 1 };

function screenToWorld(sx, sy) {
  return { x: cam.x + (sx - VW / 2) / cam.zoom, y: cam.y + (sy - VH / 2) / cam.zoom };
}
function worldToScreen(wx, wy) {
  return { x: (wx - cam.x) * cam.zoom + VW / 2, y: (wy - cam.y) * cam.zoom + VH / 2 };
}

/* ---------------- DOM 引用 ---------------- */
const moneyEl = document.getElementById('money');
const districtEl = document.getElementById('district');
const hpBar = document.getElementById('hpBar');
const apBar = document.getElementById('apBar');
const starsEl = document.getElementById('stars');
const qTitle = document.getElementById('qTitle');
const qText = document.getElementById('qText');
const qTimer = document.getElementById('qTimer');
const questEl = document.getElementById('quest');
const toastEl = document.getElementById('toast');
const flashEl = document.getElementById('flash');
const overlayEl = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const mm = document.getElementById('minimap');
const mctx = mm.getContext('2d');

/* ================================================================
   实体
   ================================================================ */
const V = [];        // 所有车辆
const peds = [];     // 行人
const cops = [];     // 警车（同时存在于 V 中）
const bullets = [];
const parts = [];

let started = false, paused = false, gameTime = 0;

const CAR_TYPES = {
  car:   { w: 46, h: 24, max: 380 },
  sport: { w: 50, h: 22, max: 430 },
  van:   { w: 58, h: 26, max: 330 },
  truck: { w: 74, h: 30, max: 285 },
  bus:   { w: 92, h: 32, max: 255 },
  cop:   { w: 50, h: 25, max: 400 }
};
const VEH_COLORS = ['#c8d5e4', '#b8503f', '#3f6fb5', '#c8a644', '#3f9e78',
                    '#8455b0', '#d6d8de', '#c4703a', '#5b6b7d', '#a9b9c9'];
const PED_COLORS = ['#d9c7a8', '#c39a7c', '#8fa4bd', '#c47f7f', '#7fae90',
                    '#b6a2c9', '#d4b06a', '#95a1b4', '#cfa98e'];

const P = {
  x: 6 * CELL, y: 4 * CELL, angle: 0,
  hp: 100, maxHp: 100, armor: 0, money: 800,
  wanted: 0, wantedCool: 0, car: null,
  cool: 0, hurt: 0, down: false, walk: 0
};

/* ---------------- 输入 ---------------- */
const keys = Object.create(null);
const inp = { up: false, down: false, left: false, right: false, sprint: false, hand: false };
const mouse = { x: 0, y: 0, down: false };

function syncInput() {
  inp.up = !!(keys['w'] || keys['arrowup']);
  inp.down = !!(keys['s'] || keys['arrowdown']);
  inp.left = !!(keys['a'] || keys['arrowleft']);
  inp.right = !!(keys['d'] || keys['arrowright']);
  inp.sprint = !!(keys['shift']);
  inp.hand = !!(keys[' ']);
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (keys[k]) { syncInput(); return; }
  keys[k] = true;
  syncInput();
  if (k === 'e') tryEnterExit();
  if (k === 'p' || k === 'escape') togglePause();
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; syncInput(); });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; syncInput(); mouse.down = false; });

window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  mouse.down = true;
  if (started && !paused && !P.down) shoot();
});
window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.down = false; });
window.addEventListener('contextmenu', (e) => e.preventDefault());

function togglePause() {
  if (!started) return;
  paused = !paused;
  if (paused) toast('已暂停 · 按 P 继续', 9999);
  else { toastEl.classList.remove('show'); toastT = 0; }
}

/* ---------------- 车辆 ---------------- */
function makeVehicle(x, y, angle, kind, type) {
  type = type || 'car';
  const spec = CAR_TYPES[type] || CAR_TYPES.car;
  return {
    x, y, angle, speed: 0, w: spec.w, h: spec.h, max: spec.max,
    type, kind, hp: 100, dead: false, marker: false,
    color: type === 'cop' ? '#20365c' : pick(VEH_COLORS),
    ti: 0, tj: 0, pi: 0, pj: 0, stuck: 0, rev: 0, shootT: 0,
    ox: x, oy: y
  };
}
function removeV(v) {
  v.dead = true;
  const i = V.indexOf(v);
  if (i >= 0) V.splice(i, 1);
}

/* ---------------- 行人 ---------------- */
function makePed(x, y) {
  return {
    x, y, angle: Math.random() * TAU, spd: 38 + Math.random() * 34,
    tx: x, ty: y, state: 'walk', fleeT: 0, dead: false, life: 0,
    color: pick(PED_COLORS), bob: Math.random() * TAU
  };
}
function pickPedTarget(p) {
  const a = Math.random() * TAU, d = 90 + Math.random() * 260;
  p.tx = clamp(p.x + Math.cos(a) * d, 20, WW - 20);
  p.ty = clamp(p.y + Math.sin(a) * d, 20, WH - 20);
}
function scarePeds(x, y, r) {
  for (const p of peds) {
    if (p.dead) continue;
    if (dist2(p.x, p.y, x, y) < r * r) {
      p.state = 'flee';
      p.fleeT = 3.2 + Math.random() * 2;
    }
  }
}

/* ---------------- 粒子 / 特效 ---------------- */
function spark(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = 60 + Math.random() * 220;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35, max: 0.35, color: '#ffd27a', size: 2 });
  }
}
function blood(x, y) {
  for (let i = 0; i < 7; i++) {
    const a = Math.random() * TAU, s = 30 + Math.random() * 130;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.55, max: 0.55, color: '#8e2330', size: 3 });
  }
}
function explode(v) {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * TAU, s = 60 + Math.random() * 340;
    parts.push({
      x: v.x, y: v.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.7, max: 0.7, color: pick(['#ffb347', '#ff6b3d', '#ffe08a', '#8a8a92']),
      size: 3 + Math.random() * 4
    });
  }
}

/* ---------------- 提示条 ---------------- */
let toastT = 0;
function toast(msg, dur) {
  dur = dur === undefined ? 2.6 : dur;
  toastEl.textContent = msg;
  toastEl.classList.remove('big');
  toastEl.classList.add('show');
  toastT = dur;
}
function bigMsg(title, sub, dur) {
  toastEl.innerHTML = title + (sub ? '<small>' + sub + '</small>' : '');
  toastEl.classList.add('show');
  toastEl.classList.add('big');
  toastT = (dur || 2400) / 1000;
}

/* ---------------- 通缉 ---------------- */
function addWanted(x) {
  P.wanted = clamp(P.wanted + x, 0, 5);
  P.wantedCool = 0;
}

/* ---------------- 伤害 / 倒下 ---------------- */
function hurtPlayer(d) {
  if (P.down) return;
  if (P.armor > 0) {
    const a = Math.min(P.armor, d * 0.6);
    P.armor -= a; d -= a;
  }
  P.hp -= d;
  P.hurt = Math.min(1, P.hurt + 0.55);
  if (P.hp <= 0) knockOut('被 击 倒', '你在医院醒来 · 损失 ¥300', 300);
}
function knockOut(title, sub, fee) {
  if (P.down) return;
  P.down = true;
  P.hp = 0;
  if (P.car) { P.car.kind = 'parked'; P.car.speed = 0; P.car = null; }
  P.money = Math.max(0, P.money - fee);
  P.wanted = 0; P.wantedCool = 0;
  while (cops.length) { const c = cops.pop(); removeV(c); }
  bigMsg(title, sub, 2300);
  setTimeout(respawn, 2400);
}
function busted() {
  if (P.down) return;
  P.down = true;
  if (P.car) { P.car.kind = 'parked'; P.car.speed = 0; P.car = null; }
  P.money = Math.max(0, P.money - 500);
  P.wanted = 0; P.wantedCool = 0;
  while (cops.length) { const c = cops.pop(); removeV(c); }
  bigMsg('被 逮 捕', '罚款 ¥500 · 警局放你出来了', 2300);
  setTimeout(respawn, 2400);
}
function respawn() {
  P.down = false; P.hp = P.maxHp; P.armor = 0; P.hurt = 0;
  const s = nodePos(5, 2);
  P.x = s.x; P.y = s.y; P.angle = 0;
  cam.x = P.x; cam.y = P.y;
}

/* ---------------- 上车 / 下车 ---------------- */
function tryEnterExit() {
  if (!started || paused || P.down) return;
  if (P.car) {
    const v = P.car;
    const side = v.angle + Math.PI / 2;
    let ex = v.x + Math.cos(side) * (v.w * 0.6 + 18);
    let ey = v.y + Math.sin(side) * (v.w * 0.6 + 18);
    const res = resolveCircle(ex, ey, 11);
    P.x = res.x; P.y = res.y;
    if (waterAt(P.x, P.y)) { P.x = v.x; P.y = v.y - v.h; }
    v.speed = 0;
    v.kind = 'parked';
    P.car = null;
    return;
  }
  let best = null, bd = Infinity;
  for (const v of V) {
    if (v.dead || v.kind === 'cop') continue;
    const d = dist2(v.x, v.y, P.x, P.y);
    if (d < bd && d < 92 * 92) { bd = d; best = v; }
  }
  if (best) {
    P.car = best;
    best.kind = 'player';
    best.speed = 0;
  }
}

/* ---------------- 射击 ---------------- */
function shoot() {
  if (P.car || P.down || P.cool > 0) return;
  P.cool = 0.155;
  const w = screenToWorld(mouse.x, mouse.y);
  const a = Math.atan2(w.y - P.y, w.x - P.x);
  P.angle = a;
  bullets.push({
    x: P.x + Math.cos(a) * 15, y: P.y + Math.sin(a) * 15,
    vx: Math.cos(a) * 980, vy: Math.sin(a) * 980,
    life: 0.9, owner: 'player'
  });
  parts.push({
    x: P.x + Math.cos(a) * 18, y: P.y + Math.sin(a) * 18,
    vx: 0, vy: 0, life: 0.06, max: 0.06, color: '#ffe9a8', size: 6
  });
  scarePeds(P.x, P.y, 340);
  if (P.wanted < 0.5) {
    for (const c of cops) if (dist2(c.x, c.y, P.x, P.y) < 500 * 500) { addWanted(1); break; }
  }
}
function fireCop(c, tx, ty) {
  const base = Math.atan2(ty - c.y, tx - c.x) + (Math.random() - 0.5) * 0.16;
  bullets.push({
    x: c.x + Math.cos(base) * 26, y: c.y + Math.sin(base) * 26,
    vx: Math.cos(base) * 820, vy: Math.sin(base) * 820,
    life: 1.0, owner: 'cop'
  });
  parts.push({ x: c.x + Math.cos(base) * 26, y: c.y + Math.sin(base) * 26,
    vx: 0, vy: 0, life: 0.06, max: 0.06, color: '#ffe9a8', size: 5 });
}

/* ---------------- 载具物理 ---------------- */
function physicsVehicle(v, dt, ctrl) {
  const ox = v.x, oy = v.y;
  const acc = ctrl.acc || 0, brk = ctrl.brake || 0, steer = ctrl.steer || 0;

  if (acc) v.speed += 700 * acc * dt;
  if (brk) v.speed -= (v.speed > 0 ? 920 : 620) * brk * dt;
  if (!acc && !brk) v.speed -= Math.sign(v.speed) * Math.min(Math.abs(v.speed), 210 * dt);
  v.speed *= (1 - 0.30 * dt);
  v.speed = clamp(v.speed, -150, v.max);
  if (Math.abs(v.speed) < 4 && !acc) v.speed = 0;
  if (ctrl.hand) v.speed *= (1 - 1.9 * dt);

  const sp = Math.abs(v.speed);
  const rate = (ctrl.hand ? 3.5 : 2.55) * clamp(sp / 130, 0, 1);
  if (sp > 6) v.angle += steer * rate * dt * Math.sign(v.speed);

  v.x += Math.cos(v.angle) * v.speed * dt;
  v.y += Math.sin(v.angle) * v.speed * dt;

  v.x = clamp(v.x, 24, WW - 24);
  v.y = clamp(v.y, 24, WH - 24);

  const r = Math.max(v.w, v.h) * 0.42;
  const res = resolveCircle(v.x, v.y, r);
  if (res.hit) {
    if (Math.abs(v.speed) > 140) {
      v.hp -= Math.abs(v.speed) * 0.045;
      spark(v.x, v.y, 3);
    }
    v.x = res.x; v.y = res.y;
    v.speed *= -0.2;
  }
  if (waterAt(v.x, v.y)) { v.x = ox; v.y = oy; v.speed *= -0.15; }
}

/* ---------------- 玩家驾驶 ---------------- */
function drivePlayerCar(dt) {
  const v = P.car;
  if (!v) return;
  physicsVehicle(v, dt, {
    acc: inp.up ? 1 : 0,
    brake: inp.down ? 1 : 0,
    steer: (inp.right ? 1 : 0) - (inp.left ? 1 : 0),
    hand: inp.hand
  });

  const sp = Math.abs(v.speed);
  // 撞行人
  if (sp > 110) {
    for (const p of peds) {
      if (p.dead) continue;
      if (dist2(p.x, p.y, v.x, v.y) < 34 * 34) {
        p.dead = true; p.life = 0;
        blood(p.x, p.y);
        addWanted(0.8);
        v.speed *= 0.9;
      }
    }
  }
  // 撞警车
  for (const c of cops) {
    if (c === v || c.dead) continue;
    if (dist2(c.x, c.y, v.x, v.y) < 52 * 52 && sp > 150) {
      c.hp -= sp * 0.06;
      spark(c.x, c.y, 4);
      addWanted(0.15);
    }
  }
  if (v.hp <= 0) {
    explode(v);
    P.car = null;
    removeV(v);
    hurtPlayer(42);
    return;
  }
  P.x = v.x; P.y = v.y; P.angle = v.angle;
}

/* ---------------- 交通 AI ---------------- */
function roadSpotNear(minD, maxD) {
  for (let k = 0; k < 70; k++) {
    const a = Math.random() * TAU;
    const d = minD + Math.random() * (maxD - minD);
    let x = P.x + Math.cos(a) * d;
    let y = P.y + Math.sin(a) * d;
    if (x < 70 || y < 70 || x > WW - 70 || y > WH - 70) continue;
    const nx = Math.round(x / CELL) * CELL;
    const ny = Math.round(y / CELL) * CELL;
    let dir;
    if (Math.abs(nx - x) <= Math.abs(ny - y)) { x = nx; dir = 'v'; }
    else { y = ny; dir = 'h'; }
    if (waterAt(x, y)) continue;
    return { x, y, dir };
  }
  return { x: P.x + 420, y: P.y, dir: 'h' };
}

function setRouteFromAngle(v) {
  const dx = Math.round(Math.cos(v.angle));
  const dy = Math.round(Math.sin(v.angle));
  const ni = clamp(Math.round(v.x / CELL), 0, COLS);
  const nj = clamp(Math.round(v.y / CELL), 0, ROWS);
  v.pi = ni; v.pj = nj;
  let ti = ni + dx, tj = nj + dy;
  if (ti < 0 || ti > COLS || tj < 0 || tj > ROWS) { ti = ni - dx; tj = nj - dy; }
  v.ti = clamp(ti, 0, COLS);
  v.tj = clamp(tj, 0, ROWS);
}

function chooseNextNode(v) {
  const opts = [];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const d of dirs) {
    const ni = v.ti + d[0], nj = v.tj + d[1];
    if (ni < 0 || nj < 0 || ni > COLS || nj > ROWS) continue;
    if (ni === v.pi && nj === v.pj) continue;
    opts.push({ ni, nj, straight: (d[0] === Math.sign(v.ti - v.pi) && d[1] === Math.sign(v.tj - v.pj)) });
  }
  let next;
  if (!opts.length) next = { ni: v.pi, nj: v.pj };
  else {
    const straight = opts.filter(o => o.straight);
    if (straight.length && Math.random() < 0.58) next = straight[0];
    else next = opts[(Math.random() * opts.length) | 0];
  }
  v.pi = v.ti; v.pj = v.tj;
  v.ti = next.ni; v.tj = next.nj;
}

function driveTraffic(v, dt) {
  if (v.dead) return;
  let tgt = nodePos(v.ti, v.tj);
  if (dist(v.x, v.y, tgt.x, tgt.y) < 62) { chooseNextNode(v); tgt = nodePos(v.ti, v.tj); }

  let dx = tgt.x - v.x, dy = tgt.y - v.y;
  const L = Math.hypot(dx, dy) || 1;
  dx /= L; dy /= L;
  const tx = tgt.x + (-dy) * 22;
  const ty = tgt.y + dx * 22;
  const want = Math.atan2(ty - v.y, tx - v.x);
  v.angle = turnTo(v.angle, want, (2.1 + Math.abs(v.speed) * 0.006) * dt);

  const vmax = v.type === 'truck' ? 118 : v.type === 'bus' ? 108 : 158;
  if (v.speed < vmax) v.speed = Math.min(vmax, v.speed + 115 * dt);
  else v.speed = Math.max(vmax, v.speed - 100 * dt);

  const ox = v.x, oy = v.y;
  v.x += Math.cos(v.angle) * v.speed * dt;
  v.y += Math.sin(v.angle) * v.speed * dt;

  const r = Math.max(v.w, v.h) * 0.42;
  const res = resolveCircle(v.x, v.y, r);
  if (res.hit) { v.x = res.x; v.y = res.y; v.speed *= -0.1; }
  if (waterAt(v.x, v.y)) { v.x = ox; v.y = oy; v.speed = 0; }

  // 撞到玩家
  if (!P.down && !P.car && Math.abs(v.speed) > 100 && dist2(v.x, v.y, P.x, P.y) < 30 * 30) {
    hurtPlayer(20);
    const a = Math.atan2(P.y - v.y, P.x - v.x);
    P.x += Math.cos(a) * 26; P.y += Math.sin(a) * 26;
  }
  if (v.hp <= 0) { explode(v); removeV(v); }
}

/* ---------------- 警察 ---------------- */
function spawnCop() {
  for (let k = 0; k < 45; k++) {
    const s = roadSpotNear(950, 2400);
    if (dist(s.x, s.y, P.x, P.y) < 800) continue;
    const v = makeVehicle(s.x, s.y, 0, 'cop', 'cop');
    v.ti = v.pi = clamp(Math.round(s.x / CELL), 0, COLS);
    v.tj = v.pj = clamp(Math.round(s.y / CELL), 0, ROWS);
    V.push(v);
    cops.push(v);
    return v;
  }
  return null;
}

function updateCops(dt) {
  const tx = P.car ? P.car.x : P.x;
  const ty = P.car ? P.car.y : P.y;
  for (let i = cops.length - 1; i >= 0; i--) {
    const c = cops[i];
    if (!c) continue;
    if (c.hp <= 0 || c.dead) {
      explode(c);
      cops.splice(i, 1); removeV(c);
      addWanted(0.35);
      continue;
    }
    const d = dist(c.x, c.y, tx, ty);
    if (d > 4600) { cops.splice(i, 1); removeV(c); continue; }

    const want = Math.atan2(ty - c.y, tx - c.x);
    const err = angDiff(c.angle, want);
    let steer = clamp(err * 2.2, -1, 1);
    let acc = 1, brake = 0;

    if (d < 85) { acc = 0; brake = 0.75; }
    if (Math.abs(err) > 1.9 && d < 320) { acc = 0.1; brake = 0.9; }

    if (Math.abs(c.speed) < 26) c.stuck += dt;
    else c.stuck = Math.max(0, c.stuck - dt * 1.7);
    if (c.stuck > 1.0) { c.stuck = 0; c.rev = 0.85; }
    if (c.rev > 0) { c.rev -= dt; acc = 0; brake = 1; steer = -steer; }

    if (Math.abs(err) > 2.4) { acc = 0.2; brake = 0.4; }

    physicsVehicle(c, dt, { acc, brake, steer });

    c.shootT -= dt;
    if (d < 560 && c.shootT <= 0 && !P.down) {
      c.shootT = 0.85 + Math.random() * 0.7;
      fireCop(c, tx, ty);
    }
    if (!P.down && !P.car && d < 42 && Math.abs(c.speed) > 70) hurtPlayer(15);
    if (P.down) return;
    if (!P.down && !P.car && d < 58 && Math.abs(c.speed) < 90) { busted(); return; }
  }
}

/* ---------------- 行人 ---------------- */
function updatePeds(dt) {
  for (const p of peds) {
    if (p.dead) { p.life += dt; continue; }
    if (p.state === 'flee') {
      p.fleeT -= dt;
      if (p.fleeT <= 0) p.state = 'walk';
      else {
        const a = Math.atan2(p.y - P.y, p.x - P.x);
        p.tx = p.x + Math.cos(a) * 200;
        p.ty = p.y + Math.sin(a) * 200;
      }
    }
    const d = dist(p.x, p.y, p.tx, p.ty);
    if (d < 14) pickPedTarget(p);
    const spd = p.state === 'flee' ? 175 : p.spd;
    const want = Math.atan2(p.ty - p.y, p.tx - p.x);
    p.angle = turnTo(p.angle, want, 7 * dt);
    p.bob += dt * (spd / 12);
    const nx = p.x + Math.cos(p.angle) * spd * dt;
    const ny = p.y + Math.sin(p.angle) * spd * dt;
    const res = resolveCircle(nx, ny, 7);
    if (res.hit || waterAt(res.x, res.y)) pickPedTarget(p);
    else { p.x = res.x; p.y = res.y; }
  }
}

/* ---------------- 子弹 / 粒子 ---------------- */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let gone = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WW || b.y > WH;

    if (!gone && b.owner === 'player') {
      for (const p of peds) {
        if (p.dead) continue;
        if (dist2(b.x, b.y, p.x, p.y) < 13 * 13) {
          p.dead = true; p.life = 0; blood(p.x, p.y);
          addWanted(1.0); gone = true; break;
        }
      }
      if (!gone) for (const c of cops) {
        if (dist2(b.x, b.y, c.x, c.y) < 27 * 27) { c.hp -= 26; spark(b.x, b.y, 4); addWanted(0.2); gone = true; break; }
      }
      if (!gone) for (const v of V) {
        if (v === P.car || v.kind === 'cop') continue;
        if (dist2(b.x, b.y, v.x, v.y) < 26 * 26) { v.hp -= 16; spark(b.x, b.y, 3); gone = true; break; }
      }
    } else if (!gone) {
      if (P.car) {
        if (dist2(b.x, b.y, P.car.x, P.car.y) < 28 * 28) { P.car.hp -= 11; hurtPlayer(5); gone = true; }
      } else if (dist2(b.x, b.y, P.x, P.y) < 13 * 13) { hurtPlayer(10); gone = true; }
    }
    if (gone) bullets.splice(i, 1);
  }
}

function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 4 * dt); p.vy *= (1 - 4 * dt);
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

/* ---------------- 世界维护 ---------------- */
let maintT = 0;
function maintainWorld(dt) {
  maintT -= dt;
  if (maintT > 0) return;
  maintT = 0.5;

  for (let i = V.length - 1; i >= 0; i--) {
    const v = V[i];
    if (v.kind !== 'traffic') continue;
    if (v.dead || dist(v.x, v.y, P.x, P.y) > 3200) removeV(v);
  }
  while (V.filter(v => v.kind === 'traffic').length < 26) {
    const s = roadSpotNear(780, 2100);
    const horiz = s.dir === 'h';
    const ang = horiz ? (Math.random() < 0.5 ? 0 : Math.PI)
                      : (Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2);
    const v = makeVehicle(
      s.x + Math.cos(ang + Math.PI / 2) * 24,
      s.y + Math.sin(ang + Math.PI / 2) * 24,
      ang, 'traffic', pick(['car', 'car', 'car', 'van', 'truck', 'sport'])
    );
    setRouteFromAngle(v);
    V.push(v);
  }

  for (const p of peds) {
    if (p.dead) continue;
    if (dist(p.x, p.y, P.x, P.y) > 2400) {
      const s = roadSpotNear(180, 1500);
      p.x = s.x; p.y = s.y; p.tx = p.x; p.ty = p.y;
      pickPedTarget(p);
    }
  }
  while (peds.length < 70) {
    const s = roadSpotNear(150, 1600);
    const p = makePed(s.x, s.y);
    pickPedTarget(p);
    peds.push(p);
  }
}

/* ---------------- 通缉刷新 ---------------- */
let copTimer = 0;
function updateWanted(dt) {
  if (P.wanted > 0.01) {
    P.wantedCool += dt;
    if (P.wantedCool > 9) P.wanted = Math.max(0, P.wanted - dt * 0.32);
  } else { P.wanted = 0; }

  copTimer -= dt;
  if (P.wanted >= 1 && !P.down) {
    const need = Math.min(4, Math.ceil(P.wanted));
    if (cops.length < need && copTimer <= 0) {
      spawnCop();
      copTimer = Math.max(0.7, 2.6 - P.wanted * 0.38);
    } else if (copTimer <= 0) copTimer = 1.4;
  }
}

const M = { idx: 0, step: 0, active: false, timer: 0, targetCar: null };

function startMission(idx) {
  if (idx >= MISSIONS.length) {
    M.active = false;
    qTitle.textContent = '全 部 完 成';
    qText.textContent = '这座城市的活儿你干完了。剩下的时间随便逛。';
    qTimer.textContent = '';
    return;
  }
  M.idx = idx; M.step = 0; M.active = true; M.timer = 0; M.targetCar = null;
  qTitle.textContent = MISSIONS[idx].title;
  questEl.classList.remove('dim');
  setupStep();
}

function setupStep() {
  const ms = MISSIONS[M.idx];
  const st = ms.steps[M.step];
  qText.textContent = st.text;
  qTimer.textContent = '';
  if (st.type === 'survive') {
    M.timer = st.time;
    P.wanted = Math.max(P.wanted, st.wanted);
  }
  if (st.type === 'steal') {
    const v = makeVehicle(st.p.x, st.p.y, 0, 'parked', 'sport');
    v.color = '#15181e';
    v.marker = true;
    V.push(v);
    M.targetCar = v;
  }
}

function advanceStep() {
  const ms = MISSIONS[M.idx];
  M.step++;
  if (M.step >= ms.steps.length) { completeMission(); return; }
  setupStep();
}

function completeMission() {
  const ms = MISSIONS[M.idx];
  P.money += ms.reward;
  M.active = false;
  questEl.classList.add('dim');
  qTitle.textContent = ms.title;
  qText.textContent = '已完成';
  qTimer.textContent = '';
  bigMsg('任 务 完 成', '+ ¥' + ms.reward + ' · ' + ms.done, 2600);
  const next = M.idx + 1;
  setTimeout(() => startMission(next), 3200);
}

function updateMissions(dt) {
  if (!M.active) return;
  const st = MISSIONS[M.idx].steps[M.step];
  if (st.type === 'survive') {
    M.timer -= dt;
    P.wanted = Math.max(P.wanted, 2);
    qTimer.textContent = '剩余 ' + Math.max(0, M.timer).toFixed(1) + ' 秒';
    if (M.timer <= 0) { qTimer.textContent = ''; advanceStep(); }
    return;
  }
  const px = P.car ? P.car.x : P.x;
  const py = P.car ? P.car.y : P.y;
  if (st.type === 'goto') {
    if (dist(px, py, st.p.x, st.p.y) < st.r) advanceStep();
  } else if (st.type === 'steal') {
    if (M.targetCar && P.car === M.targetCar) advanceStep();
  }
}

function markerPos() {
  if (!M.active) return null;
  const st = MISSIONS[M.idx].steps[M.step];
  if (st.type === 'goto') return st.p;
  if (st.type === 'steal') return M.targetCar ? { x: M.targetCar.x, y: M.targetCar.y } : st.p;
  return null;
}

/* ---------------- 镜头 ---------------- */
function updateCamera(dt) {
  const t = P.car || P;
  const zt = P.car ? 0.82 : 1.02;
  cam.zoom = lerp(cam.zoom, zt, 1 - Math.exp(-5 * dt));
  const mx = (mouse.x - VW / 2) / cam.zoom * 0.18;
  const my = (mouse.y - VH / 2) / cam.zoom * 0.18;
  let tx = t.x + mx, ty = t.y + my;
  const hw = VW / 2 / cam.zoom, hh = VH / 2 / cam.zoom;
  tx = WW > hw * 2 ? clamp(tx, hw, WW - hw) : WW / 2;
  ty = WH > hh * 2 ? clamp(ty, hh, WH - hh) : WH / 2;
  const k = 1 - Math.exp(-7 * dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);
}

/* ---------------- 主更新 ---------------- */
function update(dt) {
  gameTime += dt;
  P.hurt = Math.max(0, P.hurt - dt * 2.2);
  P.cool = Math.max(0, P.cool - dt);

  if (!paused && !P.down) {
    // 玩家
    if (P.car) drivePlayerCar(dt);
    else {
      const oy0 = P.y, ox0 = P.x;
      const dx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      const dy = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
      const L = Math.hypot(dx, dy);
      if (L > 0) {
        const spd = inp.sprint ? 250 : 152;
        P.x += dx / L * spd * dt;
        P.y += dy / L * spd * dt;
        P.walk += dt * (spd / 24);
      } else P.walk *= 0.88;
      const w = screenToWorld(mouse.x, mouse.y);
      P.angle = Math.atan2(w.y - P.y, w.x - P.x);
      const res = resolveCircle(P.x, P.y, 11);
      P.x = res.x; P.y = res.y;
      if (waterAt(P.x, P.y)) { P.x = ox0; P.y = oy0; }
      P.x = clamp(P.x, 14, WW - 14);
      P.y = clamp(P.y, 14, WH - 14);
      if (mouse.down) shoot();
    }

    for (const v of V) if (v.kind === 'traffic') driveTraffic(v, dt);
    updateCops(dt);
    updatePeds(dt);
    updateBullets(dt);
    updateParticles(dt);
    updateWanted(dt);
    updateMissions(dt);
    maintainWorld(dt);
  } else {
    updateParticles(dt);
  }

  updateCamera(dt);
  syncHUD();
  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) { toastEl.classList.remove('show'); toastEl.classList.remove('big'); }
  }
  flashEl.style.opacity = P.hurt > 0.02 ? (P.hurt * 0.85).toFixed(2) : 0;
}

/* ---------------- HUD ---------------- */
let lastStars = -1, lastMoney = -1, lastDistrict = '';
function syncHUD() {
  hpBar.style.width = (clamp(P.hp / P.maxHp, 0, 1) * 100).toFixed(1) + '%';
  apBar.style.width = (clamp(P.armor / 100, 0, 1) * 100).toFixed(1) + '%';

  if (P.money !== lastMoney) {
    moneyEl.textContent = '¥' + P.money.toLocaleString('en-US');
    lastMoney = P.money;
  }
  const n = Math.round(P.wanted);
  if (n !== lastStars) {
    let s = '';
    for (let i = 0; i < 5; i++) s += i < n ? '<b>★</b>' : '★';
    starsEl.innerHTML = s;
    lastStars = n;
  }
  const ci = clamp(Math.floor(P.x / CELL), 0, COLS - 1);
  let tag = districtOf(ci);
  let best = null, bd = 460 * 460;
  for (const l of LANDMARKS) {
    const c = cellCenter(l.i, l.j);
    const d = dist2(P.x, P.y, c.x, c.y);
    if (d < bd) { bd = d; best = l.name; }
  }
  tag = best ? tag + ' · ' + best : tag + ' 区';
  if (tag !== lastDistrict) { districtEl.textContent = tag; lastDistrict = tag; }
}

/* ================================================================
   渲染
   ================================================================ */
const WALL_COL = ['#2b3340', '#303947', '#353f4e', '#3a4556', '#404c5e', '#455266', '#4a586e', '#4f5e76', '#54647e'];
const ROOF_COL = ['#39424f', '#3e4856', '#434e5d', '#485465', '#4d5a6d', '#525f74', '#57667c', '#5c6c84', '#61728c'];
const ROOF_COL2 = ['#3d3f46', '#42444c', '#474950', '#4c4e56', '#51535c', '#565862', '#5b5d68', '#60626e', '#656774'];
const LM_ROOF = ['#3d5674', '#43607f', '#49698a', '#4f7295', '#557ba0', '#5b84ab', '#618db6', '#6796c1', '#6d9fcc'];
const CONT_COL = ['#b0522b', '#2f6f9e', '#3f7a4f'];

let frameN = 0;

function inView(x, y, pad) {
  return x > cam.x - VW / 2 / cam.zoom - pad && x < cam.x + VW / 2 / cam.zoom + pad &&
         y > cam.y - VH / 2 / cam.zoom - pad && y < cam.y + VH / 2 / cam.zoom + pad;
}

function drawGround(x0, y0, x1, y1) {
  ctx.fillStyle = '#141920';
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
}

function drawBlocks(x0, y0, x1, y1) {
  const i0 = clamp(Math.floor(x0 / CELL) - 1, 0, COLS - 1);
  const i1 = clamp(Math.floor(x1 / CELL) + 1, 0, COLS - 1);
  const j0 = clamp(Math.floor(y0 / CELL) - 1, 0, ROWS - 1);
  const j1 = clamp(Math.floor(y1 / CELL) + 1, 0, ROWS - 1);
  for (let i = i0; i <= i1; i++) {
    for (let j = j0; j <= j1; j++) {
      const b = blocks[i * ROWS + j];
      if (b.kind === 'water') {
        ctx.fillStyle = '#123048';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = 'rgba(96,178,226,.16)';
        ctx.lineWidth = 3;
        ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
        ctx.strokeStyle = 'rgba(120,190,240,.07)';
        ctx.lineWidth = 2;
        for (let k = 0; k < 4; k++) {
          ctx.beginPath();
          const wy = b.y + 60 + k * 100;
          ctx.moveTo(b.x + 30, wy);
          ctx.lineTo(b.x + b.w - 30, wy);
          ctx.stroke();
        }
      } else if (b.kind === 'beach') {
        ctx.fillStyle = '#3a3427';
        ctx.fillRect(b.x, b.y, b.w, b.h);
      } else if (b.kind === 'park') {
        ctx.fillStyle = '#1a3123';
        ctx.fillRect(b.x, b.y, b.w, b.h);
      } else {
        ctx.fillStyle = '#20262f';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = 'rgba(255,255,255,.028)';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
      }
    }
  }
  // 深圳湾大桥
  ctx.fillStyle = '#39414d';
  ctx.fillRect(BRIDGE.x, BRIDGE.y, BRIDGE.w, BRIDGE.h);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  for (let k = 0; k < 40; k++) {
    const py = BRIDGE.y + 20 + k * 46;
    if (py > BRIDGE.y + BRIDGE.h) break;
    ctx.fillRect(BRIDGE.x + 6, py, BRIDGE.w - 12, 3);
  }
  ctx.fillStyle = 'rgba(255,255,255,.2)';
  ctx.fillRect(BRIDGE.x + BRIDGE.w / 2 - 1, BRIDGE.y, 2, BRIDGE.h);
}

function drawRoads(x0, y0, x1, y1) {
  ctx.fillStyle = '#2b323c';
  for (let i = 0; i <= COLS; i++) {
    const x = i * CELL - RH;
    ctx.fillRect(x, Math.max(0, y0), ROAD, Math.min(WH, y1) - Math.max(0, y0));
  }
  for (let j = 0; j <= ROWS; j++) {
    const y = j * CELL - RH;
    ctx.fillRect(Math.max(0, x0), y, Math.min(WW, x1) - Math.max(0, x0), ROAD);
  }

  // 车道虚线
  ctx.strokeStyle = 'rgba(226,238,252,.11)';
  ctx.lineWidth = 3;
  ctx.setLineDash([22, 26]);
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, Math.max(0, y0));
    ctx.lineTo(i * CELL, Math.min(WH, y1));
    ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath();
    ctx.moveTo(Math.max(0, x0), j * CELL);
    ctx.lineTo(Math.min(WW, x1), j * CELL);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 斑马线
  if (cam.zoom > 0.62) {
    ctx.fillStyle = 'rgba(232,242,255,.10)';
    const ia = clamp(Math.floor(x0 / CELL), 0, COLS);
    const ib = clamp(Math.ceil(x1 / CELL), 0, COLS);
    const ja = clamp(Math.floor(y0 / CELL), 0, ROWS);
    const jb = clamp(Math.ceil(y1 / CELL), 0, ROWS);
    for (let i = ia; i <= ib; i++) {
      for (let j = ja; j <= jb; j++) {
        const x = i * CELL, y = j * CELL;
        for (let k = 0; k < 4; k++) {
          const o = -33 + k * 22;
          ctx.fillRect(x + o, y - RH + 8, 13, 15);
          ctx.fillRect(x + o, y + RH - 23, 13, 15);
          ctx.fillRect(x - RH + 8, y + o, 15, 13);
          ctx.fillRect(x + RH - 23, y + o, 15, 13);
        }
      }
    }
  }
}

function drawBuildings(x0, y0, x1, y1) {
  const i0 = clamp(Math.floor(x0 / CELL) - 1, 0, COLS - 1);
  const i1 = clamp(Math.floor(x1 / CELL) + 1, 0, COLS - 1);
  const j0 = clamp(Math.floor(y0 / CELL) - 1, 0, ROWS - 1);
  const j1 = clamp(Math.floor(y1 / CELL) + 1, 0, ROWS - 1);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  for (let i = i0; i <= i1; i++) {
    for (let j = j0; j <= j1; j++) {
      const arr = blocks[i * ROWS + j].buildings;
      for (let k = 0; k < arr.length; k++) {
        const b = arr[k];
        const lf = Math.min(18, 2 + b.lv * 1.7);
        ctx.fillRect(b.x + 6 + lf * 0.9, b.y + 8 + lf * 0.9, b.w, b.h);
      }
    }
  }
  // 楼体
  for (let i = i0; i <= i1; i++) {
    for (let j = j0; j <= j1; j++) {
      const blk = blocks[i * ROWS + j];
      const arr = blk.buildings;
      for (let k = 0; k < arr.length; k++) {
        const b = arr[k];
        const lv = clamp(b.lv, 1, 9) - 1;
        if (b.container) {
          ctx.fillStyle = CONT_COL[(b.tint || 0) % 3];
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.fillStyle = 'rgba(0,0,0,.22)';
          for (let q = 1; q < 5; q++) ctx.fillRect(b.x, b.y + q * (b.h / 5), b.w, 2);
          continue;
        }
        const lift = Math.min(18, 2 + b.lv * 1.7);
        const isGlass = blk.lm && blk.lm.kind === 'tower';
        const pal = isGlass ? LM_ROOF : (b.seed > 0.62 ? ROOF_COL2 : ROOF_COL);
        // 墙体：完整占地
        ctx.fillStyle = isGlass ? '#374962' : WALL_COL[lv];
        ctx.fillRect(b.x, b.y, b.w, b.h);
        // 屋顶：向左上抬升，形成伪 3D 高度
        const rx = b.x - lift * 0.45, ry = b.y - lift;
        ctx.fillStyle = pal[lv];
        ctx.fillRect(rx, ry, b.w, b.h);
        ctx.strokeStyle = 'rgba(255,255,255,.06)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(rx + 1, ry + 1, b.w - 2, b.h - 2);
        // 玻璃幕墙的反光条
        if (isGlass) {
          ctx.fillStyle = 'rgba(255,255,255,.10)';
          ctx.fillRect(rx + b.w * 0.12, ry + b.h * 0.12, b.w * 0.76, b.h * 0.16);
          ctx.strokeStyle = 'rgba(150,210,255,.32)';
          ctx.lineWidth = 3;
          ctx.strokeRect(rx, ry, b.w, b.h);
          ctx.fillStyle = 'rgba(190,230,255,.95)';
          ctx.beginPath(); ctx.arc(rx + b.w / 2, ry + b.h / 2, 6, 0, TAU); ctx.fill();
        }
        // 屋顶设备房
        if (b.w > 70 && b.h > 70) {
          ctx.fillStyle = 'rgba(255,255,255,.05)';
          ctx.fillRect(rx + b.w * 0.24, ry + b.h * 0.24, b.w * 0.52, b.h * 0.52);
          ctx.fillStyle = 'rgba(0,0,0,.18)';
          ctx.fillRect(rx + b.w * 0.24, ry + b.h * 0.24 + b.h * 0.52 - 3, b.w * 0.52, 3);
        }
        // 高层楼顶的航空障碍灯
        if (b.lv >= 7 && Math.sin(gameTime * 2 + b.x) > 0.6) {
          ctx.fillStyle = 'rgba(255,80,80,.9)';
          ctx.fillRect(rx + b.w / 2 - 2, ry + b.h / 2 - 2, 4, 4);
        }
      }
      // 体育场
      if (blk.deco === 'oval') {
        const cx = blk.x + blk.w / 2, cy = blk.y + blk.h / 2;
        ctx.fillStyle = '#2f3a46';
        ctx.beginPath(); ctx.ellipse(cx, cy, 168, 132, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#1f5a3b';
        ctx.beginPath(); ctx.ellipse(cx, cy, 132, 96, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.18)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(cx, cy, 132, 96, 0, 0, TAU); ctx.stroke();
      }
      // 树
      if (blk.trees.length) {
        for (let k = 0; k < blk.trees.length; k++) {
          const t = blk.trees[k];
          ctx.fillStyle = 'rgba(0,0,0,.32)';
          ctx.beginPath(); ctx.arc(t.x + 3, t.y + 4, t.r, 0, TAU); ctx.fill();
          ctx.fillStyle = '#2c6b46';
          ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.fill();
          ctx.fillStyle = '#3d8a5c';
          ctx.beginPath(); ctx.arc(t.x - t.r * 0.25, t.y - t.r * 0.25, t.r * 0.62, 0, TAU); ctx.fill();
        }
      }
    }
  }

  // 地标名
  if (cam.zoom > 0.55) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 16px "Microsoft YaHei","PingFang SC",sans-serif';
    for (let i = i0; i <= i1; i++) {
      for (let j = j0; j <= j1; j++) {
        const b = blocks[i * ROWS + j];
        if (!b.label) continue;
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h - 26;
        const tw = ctx.measureText(b.label).width;
        ctx.fillStyle = 'rgba(6,10,16,.58)';
        rrect(ctx, cx - tw / 2 - 9, cy - 12, tw + 18, 24, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,226,158,.94)';
        ctx.fillText(b.label, cx, cy + 1);
      }
    }
    ctx.textBaseline = 'alphabetic';
  }
}

/* ---------------- 实体绘制 ---------------- */
function drawCarShape(v, alpha) {
  const w = v.w, h = v.h;
  ctx.save();
  ctx.translate(v.x, v.y);
  ctx.rotate(v.angle);
  ctx.scale(1.12, 1.12);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;

  ctx.fillStyle = 'rgba(0,0,0,.42)';
  rrect(ctx, -w / 2 + 2, -h / 2 + 4, w, h, 5); ctx.fill();

  ctx.fillStyle = v.color;
  rrect(ctx, -w / 2, -h / 2, w, h, 5); ctx.fill();

  ctx.fillStyle = 'rgba(16,24,36,.8)';
  rrect(ctx, -w * 0.06, -h * 0.33, w * 0.30, h * 0.66, 2); ctx.fill();
  rrect(ctx, -w * 0.44, -h * 0.30, w * 0.20, h * 0.60, 2); ctx.fill();

  ctx.fillStyle = '#ffe9a8';
  ctx.fillRect(w / 2 - 6, -h / 2 + 3, 4, 4);
  ctx.fillRect(w / 2 - 6, h / 2 - 7, 4, 4);
  ctx.fillStyle = '#ff5c48';
  ctx.fillRect(-w / 2 + 2, -h / 2 + 3, 3, 4);
  ctx.fillRect(-w / 2 + 2, h / 2 - 7, 3, 4);

  if (v.kind === 'cop') {
    const on = Math.sin(gameTime * 14) > 0;
    ctx.fillStyle = on ? '#ff3b3b' : '#2f6bff';
    ctx.fillRect(-3, -h / 2 - 2, 6, 4);
    ctx.fillStyle = on ? '#2f6bff' : '#ff3b3b';
    ctx.fillRect(-3, h / 2 - 2, 6, 4);
  }
  if (v.marker) {
    ctx.strokeStyle = 'rgba(255,210,90,.9)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 34 + Math.sin(gameTime * 4) * 4, 0, TAU); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPed(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.dead) {
    ctx.globalAlpha = Math.max(0, 1 - p.life / 8);
    ctx.fillStyle = '#5c1f28';
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, p.angle, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.beginPath(); ctx.ellipse(2, 4, 8, 5, 0, 0, TAU); ctx.fill();
  ctx.rotate(p.angle);
  const bob = Math.sin(p.bob) * 1.4;
  ctx.fillStyle = 'rgba(10,14,20,.55)';
  rrect(ctx, -6, -5, 12, 10, 4); ctx.fill();
  ctx.fillStyle = p.color;
  rrect(ctx, -6.5, -5, 12, 9.4, 4); ctx.fill();
  ctx.fillStyle = '#f0d6b4';
  ctx.beginPath(); ctx.arc(3.2, bob * 0.25, 4.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(10,14,20,.55)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();
}

function drawPlayer() {
  ctx.save();
  ctx.translate(P.x, P.y);

  // 瞄准扇形
  if (!P.car) {
    ctx.fillStyle = 'rgba(120,200,255,.05)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 132, P.angle - 0.19, P.angle + 0.19);
    ctx.closePath();
    ctx.fill();
  }

  // 地面光晕，让主角在暗色路面上跳出来
  const g = ctx.createRadialGradient(0, 0, 3, 0, 0, 34);
  g.addColorStop(0, 'rgba(130,220,255,.26)');
  g.addColorStop(1, 'rgba(130,220,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(3, 5, 13, 9, 0, 0, TAU); ctx.fill();

  ctx.save();
  ctx.rotate(P.angle);
  ctx.lineJoin = 'round';

  // 身体
  ctx.fillStyle = '#eef5ff';
  ctx.strokeStyle = '#101620';
  ctx.lineWidth = 3;
  rrect(ctx, -10, -9, 20, 18, 8);
  ctx.fill();
  ctx.stroke();

  // 外套内衬
  ctx.fillStyle = '#2b3a52';
  rrect(ctx, -4, -7.5, 10, 15, 4);
  ctx.fill();

  // 头
  ctx.fillStyle = '#f6dcb8';
  ctx.strokeStyle = '#101620';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(6, 0, 5.6, 0, TAU);
  ctx.fill();
  ctx.stroke();

  // 枪
  ctx.strokeStyle = '#0f1319';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(8, 4.5); ctx.lineTo(21, 4.5); ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawEntities(x0, y0, x1, y1) {
  // 行人
  for (const p of peds) {
    if (!inView(p.x, p.y, 60)) continue;
    drawPed(p);
  }

  // 任务标记（地面）
  const mk = markerPos();
  if (mk) {
    const pulse = 0.5 + 0.5 * Math.sin(gameTime * 3);
    ctx.save();
    ctx.translate(mk.x, mk.y);
    ctx.strokeStyle = 'rgba(255,208,80,' + (0.35 + pulse * 0.45) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 46 + pulse * 16, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,208,80,.10)';
    ctx.beginPath(); ctx.arc(0, 0, 64, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,208,80,.9)';
    ctx.beginPath();
    ctx.moveTo(0, -70 - pulse * 8);
    ctx.lineTo(-10, -88 - pulse * 8);
    ctx.lineTo(10, -88 - pulse * 8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 车辆
  for (const v of V) {
    if (!inView(v.x, v.y, 120)) continue;
    drawCarShape(v);
  }

  // 玩家
  if (!P.car && !P.down) drawPlayer();
  else if (P.car) {
    // 车内高亮环
    ctx.strokeStyle = 'rgba(120,220,255,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(P.car.x, P.car.y, Math.max(P.car.w, P.car.h) * 0.62, 0, TAU);
    ctx.stroke();
  }

  // 子弹
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.strokeStyle = b.owner === 'player' ? 'rgba(255,236,170,.95)' : 'rgba(255,140,140,.95)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.011, b.y - b.vy * 0.011);
    ctx.stroke();
  }

  // 粒子
  for (const p of parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0c1016';
  ctx.fillRect(0, 0, VW, VH);

  ctx.save();
  ctx.translate(VW / 2, VH / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  const hw = VW / 2 / cam.zoom, hh = VH / 2 / cam.zoom;
  const x0 = cam.x - hw, y0 = cam.y - hh, x1 = cam.x + hw, y1 = cam.y + hh;

  drawGround(x0, y0, x1, y1);
  drawBlocks(x0, y0, x1, y1);
  drawRoads(x0, y0, x1, y1);
  drawBuildings(x0, y0, x1, y1);
  drawEntities(x0, y0, x1, y1);

  ctx.restore();

  drawWaypointArrow();
  drawReticle();
}

function drawWaypointArrow() {
  const mk = markerPos();
  if (!mk || !started) return;
  const s = worldToScreen(mk.x, mk.y);
  if (s.x > 30 && s.x < VW - 30 && s.y > 30 && s.y < VH - 30) return;
  const cx = VW / 2, cy = VH / 2;
  const a = Math.atan2(s.y - cy, s.x - cx);
  const r = Math.min(VW, VH) * 0.38;
  const x = clamp(cx + Math.cos(a) * r, 56, VW - 56);
  const y = clamp(cy + Math.sin(a) * r, 56, VH - 56);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.fillStyle = 'rgba(255,208,80,.95)';
  ctx.shadowColor = 'rgba(255,190,40,.7)';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(24, 0); ctx.lineTo(-10, 13); ctx.lineTo(-3, 0); ctx.lineTo(-10, -13);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawReticle() {
  if (!started) return;
  const x = mouse.x, y = mouse.y;
  ctx.strokeStyle = 'rgba(160,220,255,.5)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 15, y); ctx.lineTo(x - 5, y);
  ctx.moveTo(x + 5, y); ctx.lineTo(x + 15, y);
  ctx.moveTo(x, y - 15); ctx.lineTo(x, y - 5);
  ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 15);
  ctx.stroke();
}

/* ---------------- 小地图 ---------------- */
function drawMinimap() {
  const W = mm.width, H = mm.height;
  const s = Math.min(W / WW, H / WH);
  const ox = (W - WW * s) / 2, oy = (H - WH * s) / 2;

  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.fillStyle = '#080c12';
  mctx.fillRect(0, 0, W, H);

  mctx.save();
  mctx.translate(ox, oy);
  mctx.scale(s, s);

  for (const b of blocks) {
    let c = '#1b2230';
    if (b.kind === 'water') c = '#10314a';
    else if (b.kind === 'beach') c = '#3b3426';
    else if (b.kind === 'park') c = '#1d3a29';
    else if (b.kind === 'landmark') c = '#3b3348';
    mctx.fillStyle = c;
    mctx.fillRect(b.x, b.y, b.w, b.h);
  }

  mctx.strokeStyle = '#39424f';
  mctx.lineWidth = ROAD;
  mctx.beginPath();
  for (let i = 0; i <= COLS; i++) { mctx.moveTo(i * CELL, 0); mctx.lineTo(i * CELL, WH); }
  for (let j = 0; j <= ROWS; j++) { mctx.moveTo(0, j * CELL); mctx.lineTo(WW, j * CELL); }
  mctx.stroke();

  // 地标
  mctx.fillStyle = 'rgba(255,224,150,.85)';
  for (const l of LANDMARKS) {
    const c = cellCenter(l.i, l.j);
    mctx.beginPath(); mctx.arc(c.x, c.y, 13, 0, TAU); mctx.fill();
  }

  // 警车
  mctx.fillStyle = '#ff4d6a';
  for (const c of cops) {
    mctx.beginPath(); mctx.arc(c.x, c.y, 22, 0, TAU); mctx.fill();
  }
  // 普通车
  mctx.fillStyle = 'rgba(200,220,240,.45)';
  for (const v of V) {
    if (v.kind !== 'traffic' && v.kind !== 'parked') continue;
    mctx.beginPath(); mctx.arc(v.x, v.y, 15, 0, TAU); mctx.fill();
  }

  // 任务点
  const mk = markerPos();
  if (mk) {
    mctx.fillStyle = '#ffd45a';
    mctx.beginPath(); mctx.arc(mk.x, mk.y, 30, 0, TAU); mctx.fill();
  }

  // 玩家
  mctx.save();
  mctx.translate(P.x, P.y);
  if (P.car) {
    mctx.fillStyle = '#7fe3ff';
    mctx.beginPath(); mctx.arc(0, 0, 34, 0, TAU); mctx.fill();
  } else {
    mctx.rotate(P.angle);
    mctx.fillStyle = '#8ef0c0';
    mctx.beginPath();
    mctx.moveTo(38, 0); mctx.lineTo(-22, 24); mctx.lineTo(-10, 0); mctx.lineTo(-22, -24);
    mctx.closePath(); mctx.fill();
  }
  mctx.restore();

  mctx.restore();

  // 视野框
  const vw = VW / cam.zoom * s, vh = VH / cam.zoom * s;
  mctx.strokeStyle = 'rgba(180,220,255,.28)';
  mctx.lineWidth = 1.5;
  mctx.strokeRect(ox + cam.x * s - vw / 2, oy + cam.y * s - vh / 2, vw, vh);
}

/* ---------------- 初始化 ---------------- */
function spawnParkedNear(minD, maxD, type) {
  const s = roadSpotNear(minD, maxD);
  const horiz = s.dir === 'h';
  const ang = horiz ? (Math.random() < 0.5 ? 0 : Math.PI)
                    : (Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2);
  const v = makeVehicle(
    s.x + Math.cos(ang + Math.PI / 2) * 34,
    s.y + Math.sin(ang + Math.PI / 2) * 34,
    ang, 'parked',
    type || pick(['car', 'car', 'van', 'truck', 'sport'])
  );
  V.push(v);
  return v;
}

function initGame() {
  cam.x = P.x; cam.y = P.y;
  mouse.x = VW / 2; mouse.y = VH / 2;
  maintainWorld(0.5);

  for (let i = 0; i < 34; i++) spawnParkedNear(120, 3000);
  for (let i = 0; i < 8; i++) spawnParkedNear(120, 700, 'car');

  // 出生点旁边的车
  const starter = makeVehicle(P.x + 96, P.y + 30, 0, 'parked', 'sport');
  starter.color = '#e9f2ff';
  V.push(starter);

  syncHUD();
  drawMinimap();
}

/* ---------------- 主循环 ---------------- */
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (started && !paused) update(dt);

  render();
  frameN++;
  if (frameN % 3 === 0) drawMinimap();
}

/* ---------------- 启动 ---------------- */
startBtn.addEventListener('click', () => {
  if (started) return;
  started = true;
  overlayEl.classList.add('hide');
  startMission(0);
  toast('任务已发送：到华强北赛格广场取货', 3600);
});

initGame();
requestAnimationFrame(frame);

// 演示 / 截图用：URL 带 #auto 时自动开始；#auto,x,y 可指定出生坐标
if (typeof location !== 'undefined' && location.hash.indexOf('auto') >= 0) {
  const seg = location.hash.replace('#', '').split(',');
  if (seg.length >= 3) {
    const tx = parseInt(seg[1], 10), ty = parseInt(seg[2], 10);
    if (!isNaN(tx) && !isNaN(ty)) { P.x = tx; P.y = ty; cam.x = tx; cam.y = ty; }
  }
  overlayEl.style.transition = 'none';
  setTimeout(() => startBtn.click(), 80);
}
</script>
